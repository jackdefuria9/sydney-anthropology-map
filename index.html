<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Sydney Anthropology Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

<style>
body {
    margin: 0;
}

.container {
    display: flex;
    height: 100vh;
}

#map {
    width: 70%;
    height: 100%;
}

#info {
    width: 30%;
    padding: 20px;
    overflow-y: auto;
    border-left: 1px solid #ccc;
    font-family: Arial, sans-serif;
}

</style>

</head>

<body>

<div class="container">

    <div id="map"></div>

    <div id="info">
        <h2>Click a locality</h2>
        <p>Information will appear here.</p>
    </div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiamFja2RlZnVyaWE5IiwiYSI6ImNtd2hmaDhyNTAwZWwyeW9odGl6Z2pvcTEifQ.AaJfcjadd8p1qsv6SDsThA';

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/jackdefuria9/cmwh41od700c201sg8u111uzn',
    center: [151.2093, -33.8688],
    zoom: 11
});

map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
map.addSource('test-localities', {
    type: 'vector',
    url: 'mapbox://jackdefuria9.w9uzgf3xyu0k'
});

map.addLayer({
    id: 'test-localities',
    type: 'fill',
    source: 'test-localities',
    'source-layer': 'x07wqcid6d7jjsrs5wbm',
    paint: {
        'fill-color': '#ff0000',
        'fill-opacity': 0.3
    }
});
});

    map.on('click', 'test-localities', (e) => {

    const p = e.features[0].properties;

    alert(Object.keys(p).join('\n'));

    document.getElementById('info').innerHTML = `
 
<h2>${p.LOC_NAME}</h2>
 
<h3>Region</h3>
<p>${p["Locality Research Test — Sheet1_Region"] || ""}</p>
 
<h3>Historical Summary</h3>
<p>${p["Locality Research Test — Sheet1_Historical Summary"] || ""}</p>
 
<h3>Cultural Identity</h3>
<p>${p["Locality Research Test — Sheet1_Cultural Identity"] || ""}</p>
 
<h3>Indigenous Context</h3>
<p>${p["Locality Research Test — Sheet1_Indigenous Context"] || ""}</p>
 
<h3>Photo 1</h3>
<img
src="${p["Locality Research Test — Sheet1_Photo URL 1"] || ""}"
style="width:100%; border-radius:8px;"
>
 
<h3>Photo 2</h3>
<img
src="${p["Locality Research Test — Sheet1_Photo URL 2"] || ""}"
style="width:100%; border-radius:8px;"
>
 
<h3>Audio</h3>
 
<audio controls style="width:100%;">
<source
src="${p["Locality Research Test — Sheet1_Audio URL"] || ""}"
type="audio/mpeg">
</audio>
 
`;

});
    
</script>

</body>

</html>
