<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sydney Anthropology Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.header {
    background: #1e293b;
    color: white;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 80px);
}

#map {
    width: 65%;
}

.info-panel {
    width: 35%;
    padding: 20px;
    overflow-y: auto;
    border-left: 1px solid #ccc;
    box-sizing: border-box;
}
</style>
</head>

<body>

<div class="header">
    Sydney Anthropology Map
</div>

<div class="container">

    <div id="map"></div>

    <div class="info-panel">

        <h2 id="localityName">Click a locality</h2>

        <p>
            When we connect your locality data, details for the clicked
            locality will appear here.
        </p>

    </div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiamFja2RlZnVyaWE5IiwiYSI6ImNtd2hmaDhyNTAwZWwyeW9odGl6Z2pvcTEifQ.AaJfcjadd8p1qsv6SDsThA';

const map = new mapboxgl.Map({
    container: 'map',

    style: 'mapbox://styles/jackdefuria9/cmwh41od700c201sg8u111uzn',

    center: [151.2093, -33.8688],

    zoom: 8
});

map.addControl(new mapboxgl.NavigationControl());
map.on('click', (e) => {
    console.log(e);
});
</script>

</body>
</html>
