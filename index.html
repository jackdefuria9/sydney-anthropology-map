<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Sydney Anthropology Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.header {
    background: #0f172a;
    color: white;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.container {
    display: flex;
    height: calc(100vh - 70px);
}

#map {
    width: 70%;
    height: 100%;
}

#info {
    width: 30%;
    padding: 24px;
    overflow-y: auto;
    border-left: 1px solid #d1d5db;
    background: white;
    box-sizing: border-box;
}

#info h2 {
    font-size: 54px;
    color: #0f172a;
    line-height: 1;
    margin: 0;
    padding: 0;
}

#info h3 {
    font-size: 24px;
    color: #0f172a;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 8px;
    margin-top: 30px;
}


#info p {
    line-height: 1.6;
    color: #475569;
}

#info img {
width: 100%;
border-radius: 14px;
margin-bottom: 20px;
box-shadow: 0 4px 14px rgba(0,0,0,0.12);
max-height: 280px;
object-fit: cover;
}

audio {
    width: 100%;
    margin-top: 10px;
}

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #f1f5f9;
}

::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #64748b;
}

.region {
    font-size: 18px;
    color: #64748b;
    margin-top: 8px;
    margin-bottom: 24px;
    font-weight: 500;
}
    
</style>

</head>

<body>
<body>

<div class="header">
    Sydney Anthropology Map
</div>

<div class="container">

    <div id="map"></div>

    <div id="info">
        <h2>Click a locality</h2>
        <p>Information will appear here.</p>
    </div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiamFja2RlZnVyaWE5IiwiYSI6ImNtd2hmaDhyNTAwZWwyeW9odGl6Z2pvcTEifQ.AaJfcjadd8p1qsv6SDsThA';

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/jackdefuria9/cmwh41od700c201sg8u111uzn',
    center: [151.2093, -33.8688],
    zoom: 11
});

map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
map.addSource('test-localities', {
    type: 'vector',
    url: 'mapbox://jackdefuria9.w9uzgf3xyu0k'
});

    map.addSource('landmarks', {
    type: 'vector',
    url: 'mapbox://jackdefuria9.yflrvmo0gzpb'
});
        
map.addLayer({
    id: 'test-localities',
    type: 'fill',
    source: 'test-localities',
    'source-layer': 'x07wqcid6d7jjsrs5wbm',
    paint: {
        'fill-opacity': 0
    }
});
});

    map.on('click', 'test-localities', (e) => {

    const p = e.features[0].properties;
        
    document.getElementById('info').innerHTML = `
 
<h2>${p.LOC_NAME}</h2>

<div class="region">
    ${p["Locality Research Test — Sheet1_Region"] || ""}
</div>

<img
src="${p["Locality Research Test — Sheet1_Photo URL 1"] || ""}"
style="width:100%; border-radius:8px;"
>
 
<img
src="${p["Locality Research Test — Sheet1_Photo URL 2"] || ""}"
style="width:100%; border-radius:8px;"
>
 
<audio controls style="width:100%;">
<source
src="${p["Locality Research Test — Sheet1_Audio URL"] || ""}"
type="audio/mpeg">
</audio>

<h3>Historical Summary</h3>
<p>${p["Locality Research Test — Sheet1_Historical Summary"] || ""}</p>
 
<h3>Cultural Identity</h3>
<p>${p["Locality Research Test — Sheet1_Cultural Identity"] || ""}</p>
 
<h3>Indigenous Context</h3>
<p>${p["Locality Research Test — Sheet1_Indigenous Context"] || ""}</p>
 
`;

});
    
</script>

</body>

</html>
