<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>Sydney Anthropology Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

<style>
body {
    margin: 0;
}

.container {
    display: flex;
    height: 100vh;
}

#map {
    width: 70%;
    height: 100%;
}

#info {
    width: 30%;
    padding: 20px;
    overflow-y: auto;
    border-left: 1px solid #ccc;
    font-family: Arial, sans-serif;
}

</style>

</head>

<body>

<div class="container">

    <div id="map"></div>

    <div id="info">
        <h2>Click a locality</h2>
        <p>Information will appear here.</p>
    </div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiamFja2RlZnVyaWE5IiwiYSI6ImNtd2hmaDhyNTAwZWwyeW9odGl6Z2pvcTEifQ.AaJfcjadd8p1qsv6SDsThA';

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/jackdefuria9/cmwh41od700c201sg8u111uzn',
    center: [151.2093, -33.8688],
    zoom: 11
});

map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {

    map.addSource('localities-source', {
        type: 'vector',
        url: 'mapbox://jackdefuria9.w9uzgf3xyu0k'
    });

    map.addLayer({
        id: 'localities-clickable',
        type: 'fill',
        source: 'localities-source',
        'source-layer': 'Locality_Test',
        paint: {
            'fill-color': '#ff0000',
            'fill-opacity': 0.25
        }
    });

    map.on('click', 'localities-clickable', (e) => {
        alert(e.features[0].properties.LOC_NAME);
    });

    console.log(map.getStyle());
});
    map.on('click', (e) => {

    const features = map.queryRenderedFeatures(
        e.point,
        {
            layers: ['Localities']
        }
    );

    alert(features.length);

});
    
</script>

</body>

</html>
